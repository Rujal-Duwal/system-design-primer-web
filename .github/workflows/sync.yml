name: sync content from the primer

# Run on demand only. There is deliberately no schedule: content refreshes
# happen when someone asks for one.
#
# The trade-off is worth stating plainly — between runs, this site can fall
# behind the README it rebuilds from. What the sync still refuses to do is
# paper over a real break: a mapped anchor that disappears upstream fails the
# run rather than quietly dropping a section.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch and rebuild content
        run: npm run sync

      # A section whose anchor moved upstream must surface as a failure, not as
      # a page that quietly went blank. `npm run sync` already exits non-zero on
      # a broken mapping; this proves the site still builds from the result.
      - name: Verify the build still works
        run: |
          npm run typecheck
          npm run verify:levels
          npm run build

      - name: Push a branch if anything changed
        run: |
          # syncedAt only moves when the content hash moves, so an unchanged
          # upstream really is an empty diff here rather than a timestamp bump.
          if [ -z "$(git status --porcelain content/generated public/primer-images)" ]; then
            echo "Upstream is unchanged — nothing to do."
            {
              echo "### Upstream unchanged"
              echo ""
              echo "The primer has not changed since the last sync. No branch pushed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BRANCH="content/sync-$(date +%Y%m%d-%H%M%S)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add content/generated public/primer-images
          git commit -m "content: sync from donnemartin/system-design-primer"
          git push origin "$BRANCH"

          # A branch rather than a pull request: opening one from Actions needs
          # "Allow GitHub Actions to create and approve pull requests", which is
          # off for this repo by choice. Opening it by hand is one click.
          {
            echo "### Upstream changed"
            echo ""
            echo "Pushed \`$BRANCH\`. Review and open a pull request:"
            echo ""
            echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
            echo ""
            echo "Read the diff for anything that renders oddly — a heading rename"
            echo "upstream can move where a section starts or stops."
          } >> "$GITHUB_STEP_SUMMARY"
